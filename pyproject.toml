[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "BLE"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402", "E501"]

[tool.mypy]
files = ["capital_gain_estimate_tax_calculator"]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["capital_gain_estimate_tax_calculator"]
branch = true
