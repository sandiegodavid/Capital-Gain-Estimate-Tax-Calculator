standard_deduction:
  type: state_fixed_with_phaseout
  calculation_supported: false
  single: 15700
  married_filing_jointly: 31400
  married_filing_separately: 15700
  head_of_household: 23550
  qualifying_surviving_spouse: 31400
  additional_65_or_blind: {unmarried: 2050, married_or_qualifying_surviving_spouse: 1650}
brackets:
  ordinary:
    single: &single [{bracket: 27400, rate: 5.8}, {bracket: 64850, rate: 6.75}, {bracket: null, rate: 7.15}]
    married_filing_jointly: &joint [{bracket: 54850, rate: 5.8}, {bracket: 129750, rate: 6.75}, {bracket: null, rate: 7.15}]
    married_filing_separately: *single
    head_of_household: &hoh [{bracket: 41100, rate: 5.8}, {bracket: 97300, rate: 6.75}, {bracket: null, rate: 7.15}]
    qualifying_surviving_spouse: *joint
  surcharge:
    single: [{bracket: 1000000, rate: 0}, {bracket: null, rate: 2}]
    married_filing_jointly: &surcharge_joint [{bracket: 1500000, rate: 0}, {bracket: null, rate: 2}]
    married_filing_separately: [{bracket: 750000, rate: 0}, {bracket: null, rate: 2}]
    head_of_household: *surcharge_joint
    qualifying_surviving_spouse: *surcharge_joint
capital_gains: {treatment: ordinary_schedule_plus_income_surcharge, calculation_supported: true}
dependent_benefits:
  - {name: dependent_exemption_tax_credit, type: refundable_credit_for_residents, statutory_base_per_dependent: 300, inflation_adjusted_amount: null, phaseout_applies: true}
other_credits: []
calculation_notes:
  - "Personal exemption is $5,300 for the taxpayer and eligible spouse; it is not a per-dependent exemption."
  - "The standard deduction and personal exemption phase out at higher Maine income."
